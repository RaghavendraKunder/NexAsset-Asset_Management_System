<div class="register-page">
  <!-- Background -->
  <div class="register-background"></div>
  <main class="register-container">
    <div class="brand-decoration">
      <span></span>
      <mat-icon>workspace_premium</mat-icon>
      <span></span>
    </div>
    <!-- Heading -->
    <section class="register-heading">
      <h1>Join the Ranks</h1>
      <p>
        Create your account and unlock full access.
      </p>
    </section>
    <!-- Register Card -->
    <mat-card class="register-card">
      <!-- Auth Tabs -->
      <div class="auth-tabs">
        <button
          type="button"
          class="auth-tab"
          (click)="goToLogin()">
          SIGN IN
        </button>
        <button
          type="button"
          class="auth-tab active">
          REGISTER
        </button>
      </div>
      <form
        [formGroup]="registerForm"
        (ngSubmit)="onRegister()">
        <div class="name-row">
          <div class="form-group">
            <label>FIRST NAME</label>
            <div class="input-wrapper">
              <mat-icon class="input-icon">
                person_outline
              </mat-icon>
              <input
                type="text"
                formControlName="firstName"
                placeholder="John"
                autocomplete="given-name">
            </div>
          </div>
          <div class="form-group">
            <label>LAST NAME</label>
            <div class="input-wrapper">
              <mat-icon class="input-icon">
                person_outline
              </mat-icon>
              <input
                type="text"
                formControlName="lastName"
                placeholder="Doe"
                autocomplete="family-name">
            </div>
          </div>
        </div>
        <div class="form-group">
          <label>EMAIL</label>

          <div class="input-wrapper">

            <mat-icon class="input-icon">
              mail_outline
            </mat-icon>

            <input
              type="email"
              formControlName="email"
              placeholder="you@domain.com"
              autocomplete="email">

          </div>

        </div>


        <!-- Password -->
        <div class="form-group">

          <label>PASSWORD</label>

          <div class="input-wrapper">

            <mat-icon class="input-icon">
              lock_outline
            </mat-icon>

            <input
              [type]="hidePassword ? 'password' : 'text'"
              formControlName="password"
              placeholder="Create password"
              autocomplete="new-password">

            <button
              type="button"
              class="password-toggle"
              (click)="hidePassword = !hidePassword">

              <mat-icon>
                {{ hidePassword ? 'visibility' : 'visibility_off' }}
              </mat-icon>

            </button>

          </div>

        </div>


        <!-- Confirm Password -->
        <div class="form-group confirm-password-group">

          <label>CONFIRM PASSWORD</label>

          <div class="input-wrapper">

            <mat-icon class="input-icon">
              lock_outline
            </mat-icon>

            <input
              [type]="hideConfirmPassword ? 'password' : 'text'"
              formControlName="confirmPassword"
              placeholder="Repeat password"
              autocomplete="new-password">

            <button
              type="button"
              class="password-toggle"
              (click)="hideConfirmPassword = !hideConfirmPassword">

              <mat-icon>
                {{ hideConfirmPassword
                  ? 'visibility'
                  : 'visibility_off' }}
              </mat-icon>

            </button>

          </div>

        </div>


        <!-- Security Information -->
        <div class="security-info">

          <div class="security-item">

            <mat-icon>
              verified_user
            </mat-icon>

            <span>
              End-to-end encrypted
            </span>

          </div>

        </div>


        <!-- Create Account -->
        <button
          type="submit"
          class="create-account-button">

          <span>CREATE ACCOUNT</span>

          <mat-icon>
            arrow_forward
          </mat-icon>

        </button>


        <!-- Terms -->
        <p class="terms-text">

          By registering, you agree to our

          <button
            type="button"
            class="terms-link">
            Terms
          </button>

          and

          <button
            type="button"
            class="terms-link">
            Privacy Policy
          </button>

        </p>


      </form>

    </mat-card>


    <!-- Already Member -->
    <div class="already-member">

      <span>
        Already a member?
      </span>

      <button
        type="button"
        (click)="goToLogin()">

        Sign in

      </button>

    </div>


  </main>

</div>
